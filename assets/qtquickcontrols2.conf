; Qt Quick Controls style settings, read by Qt from the app resources.
; Environment variables like QT_QUICK_CONTROLS_MATERIAL_THEME override them.

[Controls]
Style=Material

[Material]
; Follow the system's light or dark mode
Theme=System
; The denser controls meant for desktop use
Variant=Dense
; A named colour, so Material picks a lighter shade in dark mode
Accent=Blue
