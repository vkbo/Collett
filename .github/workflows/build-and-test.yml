name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang-format \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtcore qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qt6-svg-plugins libnuspell-dev
          pip install --break-system-packages gcovr

      - name: Check Formatting
        run: ./format.sh --check

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCOLLETT_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run Tests and Generate Coverage Report
        run: cmake --build build --target coverage

      - name: Format Coverage Report
        run: |
          {
            echo '### Coverage Report (Linux)'
            echo
            echo '<details>'
            echo '<summary>Full Coverage Report</summary>'
            echo
            cat build/coverage/coverage.md
            echo
            echo '</details>'
            echo
            echo "**Total: $(awk '/^TOTAL/ { print $NF }' build/coverage/coverage.txt)**"
          } > coverage-report.md

      - name: Write Coverage Summary
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo '<!-- coverage-report -->'
            cat coverage-report.md
          } > coverage-comment.md
          comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | startswith("<!-- coverage-report -->")) | .id' | head -n1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@coverage-comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file coverage-comment.md
          fi
